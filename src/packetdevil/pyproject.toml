[project]
name = "packetdevil"
version = "0.1.0"
description = "Suricata alert triage: temporary RouterOS firewall blocks + Telegram alerts for severe threats."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
]

[project.scripts]
packetdevil = "packetdevil.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["packetdevil*"]

# Managed with uv (https://docs.astral.sh/uv/). `uv sync` installs this
# group by default alongside project deps; run tools via `uv run <tool>`.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "black>=24.0",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
